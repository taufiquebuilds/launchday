name: Bug report
description: Something in the skill or a script did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (Claude Code, Codex, Cursor...)
  - type: textarea
    id: output
    attributes:
      label: Script output or the agent's reply, if relevant
      render: text
